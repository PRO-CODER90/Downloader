# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: downloader
    runtime: docker
    plan: starter        # "free" works but sleeps when idle and has little RAM for ffmpeg
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MAX_CONCURRENT_JOBS
        value: "3"
      - key: FILE_TTL_MINUTES
        value: "30"
      - key: MAX_FILESIZE
        value: "2G"
      - key: MAX_JOBS_PER_IP
        value: "3"
      # Only needed if the frontend is on another domain (e.g. Vercel). Empty = same-origin only.
      - key: CORS_ORIGIN
        sync: false
      # Optional: contents of cookies.txt (or upload a Secret File named cookies.txt instead)
      - key: YTDLP_COOKIES
        sync: false
